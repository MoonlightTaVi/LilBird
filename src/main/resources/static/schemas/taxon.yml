type: object
properties:
  taxon_name:
    description: The type of taxon in the taxonomy classification.
    type: string
    example: family
  latin_name:
    description: The main latin name of the taxon.
    type: string
    pattern: (?=.*[a-zA-Z])[0-9a-zA-Z\s-]+
    example: Corvidae
  name:
    description: The most common name of the taxon.
    type: string
    example: Corvids
  species_length:
    description: Total number of species in this taxon and sub-taxons (if any).
    type: integer
    format: int32
    minimum: 1
    example: 135
required:
  - taxon_name
  - latin_name
  - species_length
