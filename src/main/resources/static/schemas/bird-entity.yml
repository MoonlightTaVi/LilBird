type: object
description: The core information about a bird.
properties:
    nameNormal:
      description: >
        Same as nameLatin, but normalized for convenience.
        Serves as an ID of the entity.
      type: string
      example: bubo+scandiacus
      pattern: (?=.*[a-z])[0-9a-z+]+
    nameLatin:
      description: The base latin name (unique).
      type: string
      pattern: (?=.*[a-zA-Z])[0-9a-zA-Z\s-]+
      example: Bubo scandiacus
    nameMain:
      description: (Optional) The most common name.
      type: string
      example: Snowy owl
required:
  - nameLatin
  - nameNormal
