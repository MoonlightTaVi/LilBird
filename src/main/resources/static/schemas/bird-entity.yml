type: object
description: >
  A bird row. The only stored fact is the latin name;
  the normalized form of that name is the id.
properties:
  nameNormal:
    description: >
      nameLatin after normalization: lower-case, with each run of
      white space replaced by "+". This is the id of the bird.
    type: string
    example: bubo+scandiacus
    pattern: '(?=.*[a-z])[a-z+]+'
  nameLatin:
    description: The bird's own latin name.
    type: string
    pattern: '(?=.*[a-zA-Z])[a-zA-Z\s-]+'
    example: Bubo scandiacus
required:
  - nameLatin
  - nameNormal
