type: object
description: >
  A bird card. The bird itself is identified only by its latin name.
  Other names are listed separately. Etymologies are not part of this card.
properties:
  name_latin:
    description: The bird's own latin name. It identifies the bird.
    type: string
    pattern: '(?=.*[a-zA-Z])[a-zA-Z\s-]+'
    example: Bubo scandiacus
  names:
    description: >
      Alternative latin names and localized names, in insertion order.
    type: array
    items:
      $ref: './bird-name.yml'
    example:
      - value: Snowy owl
        latin: false
        primary: true
      - value: Polar owl
        latin: false
        primary: false
      - value: Nyctea scandiaca
        latin: true
        primary: false
required:
  - name_latin
