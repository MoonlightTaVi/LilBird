type: object
properties:
  name_latin:
    type: string
    pattern: '[0-9a-zA-Z\\-\s]+'
    description: The base latin name of the bird.
    example: Bubo scandiacus
  name_main:
    type: string
    description: The main common name of the bird.
    example: Snowy owl
  etymologies:
    type: array
    description: A list of etymologies for the alternative names.
    items:
      type: string
    example:
      - From Middle English "oule", related to the sound of the owl's hoot.
      - They inhabit polar regions.
  alt_names:
    type: array
    description: Groups of names for each etymology.
    items:
      type: array
      items:
        type: string
    example:
      - ["Owl"]
      - ["Snowy owl", "Polar owl"]
  photo_urls:
    type: array
    description: A list of URLs to photos of this bird.
    items:
      type: string
      format: uri
    example:
      - https://url1.com/photo.png
      - https://url2.com/photo.jpeg
required:
  - nameLatin
