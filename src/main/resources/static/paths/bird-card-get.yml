get:
    summary: Returns the card for one bird.
    description: >
      The card contains the bird's latin name and the names stored for it.
      The path value is normalized before the lookup, so both the displayed
      latin name and the normalized id are accepted.
    parameters:
      - name: name_latin
        in: path
        required: true
        description: The bird's latin name, or its normalized id.
        schema:
          type: string
          example: Bubo scandiacus
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/bird-card.yml'
      "404":
        description: No such bird
