post:
    summary: Creates a bird from a card.
    description: >
      Stores the latin name on the bird and every other name as a separate name row.
    requestBody:
      description: The card to create.
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/bird-card.yml'
    responses:
      "201":
        description: Created successfully.
      "400":
        description: Some of the parameters are invalid (see the schema).
