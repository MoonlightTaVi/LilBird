get:
  summary: Get the taxon by its name.
  parameters:
    - name: latin_name
      in: path
      required: true
      description: >
        The latin name of the taxon. The value is normalized before the lookup.
      schema:
        type: string
        example: Corvidae
  responses:
    "200":
      description: Ok.
      content:
        application/json:
          schema:
            $ref: ../schemas/taxon.yml
    "404":
      description: No such taxon.
