get:
  summary: Get a filtered list of taxons.
  description: >
    Get the list of taxons based on their type (taxon_name) 
    and number of species (species_length).
    Optionally, a range may be used to filter by the number of species
    (otherwise only the exact matches will be included).
  parameters:
    - name: taxon
      in: query
      required: true
      description: The type of the taxons.
      schema:
        type: string
        example: family
    - name: species
      in: query
      required: true
      description: The required total number of species in taxons.
      schema:
        type: integer
        format: int32
        example: 100
    - name: range
      in: query
      required: false
      description: This number will be added to 'species' to filter within a specific range.
      schema:
        type: integer
        format: int32
        example: 50
  responses:
    "200":
      description: Ok.
